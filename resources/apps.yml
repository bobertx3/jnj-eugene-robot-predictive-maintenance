resources:
  apps:
    jnj_dsp2_gold_genie_app:
      name: bottava-predictive-maintenance
      description: Bottava Robot Predictive Maintenance app with gold summary and Genie chat
      source_code_path: ../apx-app/.build
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: BOTTAVA Maintenance Analyst
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: lakebase-db
          database:
            instance_name: robots-db
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
